spring.application.name=TribalConnect

# Server Configuration
server.port=8080

# Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/ecommerce?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=LClc17@$
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.thymeleaf.cache=false

# OAuth2 Google Configuration (use env vars in production; set dummy for local)
spring.security.oauth2.client.registration.google.client-name=google
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:dummy-client-id}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:dummy-client-secret}
spring.security.oauth2.client.registration.google.scope=profile, email


# Multipart Config
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB

# Hikari & Tomcat Config
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.idle-timeout=300000
server.tomcat.threads.max=4
server.tomcat.threads.min-spare=1
server.tomcat.accept-count=10

# AI (Ollama — disabled locally; use env var in prod)
spring.ai.ollama.url=${AI_URL}
spring.ai.ollama.chat.options.model=${AI_MODEL}
spring.ai.ollama.chat.options.temperature=0.2

# Google Gemini API
spring.google.api.key=${GOOGLE_API_KEY}
google.api.key=${GOOGLE_API_KEY}
google.api.model=${AI_MODEL}

# Cloudinary Config (optional for local — image upload will fail gracefully)
cloudinary.cloud_name=${CLOUDINARY_CLOUDNAME}
cloudinary.api_key=${CLOUDINARY_KEY}
cloudinary.api_secret=${CLOUDINARY_SECRET}

# Razorpay (optional for local)
razorpay.key.id=${RAZORPAY_KEY_ID}
razorpay.key.secret=${RAZORPAY_KEY_SECRET}
