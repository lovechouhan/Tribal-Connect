spring.application.name=TribalConnect

# Server Configuration
server.port=8080

# Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/ecommerce?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=LClc17@$
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.thymeleaf.cache=false
spring.sql.init.mode=never
spring.jpa.defer-datasource-initialization=true

# OAuth2 Google Configuration (use env vars in production; set dummy for local)
spring.security.oauth2.client.registration.google.client-name=google
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:dummy-client-id}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:dummy-client-secret}
spring.security.oauth2.client.registration.google.scope=profile, email

# Twilio SMS (disabled locally — set real values in prod)
twilio.account-sid=${TWILIO_ACCOUNT_SID:ACdummy}
twilio.auth-token=${TWILIO_AUTH_TOKEN:dummy-token}
twilio.phone-number=${TWILIO_PHONE_NUMBER:+10000000000}

# Multipart Config
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB

# Hikari & Tomcat Config
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.idle-timeout=300000
server.tomcat.threads.max=4
server.tomcat.threads.min-spare=1
server.tomcat.accept-count=10

# AI (Ollama — disabled locally; use env var in prod)
spring.ai.ollama.url=${AI_URL:http://localhost:11434}
spring.ai.ollama.chat.options.model=phi3
spring.ai.ollama.chat.options.temperature=0.2

# Google Gemini API
spring.google.api.key=${GOOGLE_API_KEY:dummy-gemini-key}
google.api.key=${GOOGLE_API_KEY:dummy-gemini-key}
google.api.model=gemini-1.5-flash

