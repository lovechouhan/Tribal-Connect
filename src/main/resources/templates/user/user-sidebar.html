<div id="sidebar-backdrop" class="fixed inset-0 z-40 hidden bg-black bg-opacity-50"></div>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>

<aside th:fragment="userSidebar"
       id="logo-sidebar"
       style="position:fixed;left:0;top:0;z-index:200;width:256px;height:100vh;transform:translateX(-100%);transition:transform 0.3s ease;background:linear-gradient(180deg,#6B4226 0%,#4A2E16 100%);border-right:3px solid #D4960A;display:flex;flex-direction:column;"
       aria-label="User Sidebar">

<script th:inline="javascript">
document.addEventListener('DOMContentLoaded', function() {
  const sidebar = document.getElementById('logo-sidebar');
  const toggleBtn = document.getElementById('sidebar-toggle');
  const backdrop = document.getElementById('sidebar-backdrop');
  if (sidebar && toggleBtn) {
    const open  = () => { sidebar.style.transform='translateX(0)'; if(backdrop) backdrop.classList.remove('hidden'); };
    const close = () => { sidebar.style.transform='translateX(-100%)'; if(backdrop) backdrop.classList.add('hidden'); };
    toggleBtn.addEventListener('click', e => { e.stopPropagation(); sidebar.style.transform.includes('-100%') ? open() : close(); });
    document.addEventListener('click', e => { if(!sidebar.contains(e.target)&&!toggleBtn.contains(e.target)) close(); });
    if(backdrop) backdrop.addEventListener('click', close);
    document.addEventListener('keydown', e => { if(e.key==='Escape') close(); });
  }
});
</script>

  <!-- Brand -->
