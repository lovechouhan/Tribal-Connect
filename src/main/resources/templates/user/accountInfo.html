<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
 xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
 layout:decorate="~{base}">
<head>
    <title>My Account - TribalConnect</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .ai-page { background:linear-gradient(160deg,#fdf6ed 0%,#f5e8d3 100%); min-height:100vh; padding:36px 16px 72px; }
        .ai-hero {
            max-width:820px; margin:0 auto 30px;
            background:linear-gradient(135deg,#2C1810 0%,#6B4226 55%,#C05C2E 100%);
            border-radius:22px; padding:32px 38px;
            display:flex; align-items:center; gap:24px; flex-wrap:wrap;
            box-shadow:0 8px 40px rgba(44,24,16,.22); position:relative; overflow:hidden;
        }
        .ai-hero::after { content:''; position:absolute; right:-70px; top:-70px; width:240px; height:240px; border-radius:50%; background:rgba(255,255,255,.06); }
        .avatar-wrap { width:82px; height:82px; border-radius:50%; background:rgba(255,255,255,.18); border:3px solid rgba(255,255,255,.35); display:flex; align-items:center; justify-content:center; flex-shrink:0; overflow:hidden; }
        .avatar-wrap img { width:100%; height:100%; object-fit:cover; border-radius:50%; }
        .ai-hero h1 { font-family:'Playfair Display',serif; font-size:1.7rem; font-weight:800; color:#fff; margin:0 0 4px; }
        .ai-hero p  { color:rgba(255,255,255,.72); margin:0 0 10px; font-size:.88rem; }
        .hero-badges { display:flex; gap:9px; flex-wrap:wrap; }
        .hero-badge { padding:4px 13px; border-radius:20px; font-size:.74rem; font-weight:700; background:rgba(255,255,255,.15); color:#fff; }
        .hero-badge.blue  { background:#dbeafe; color:#1d4ed8; }
        .edit-btn { background:rgba(255,255,255,.18); color:#fff; border:1.5px solid rgba(255,255,255,.4); padding:9px 18px; border-radius:10px; font-size:.83rem; font-weight:700; text-decoration:none; display:flex; align-items:center; gap:8px; backdrop-filter:blur(6px); transition:background .2s; align-self:flex-start; }
        .edit-btn:hover { background:rgba(255,255,255,.28); }
        .info-card { max-width:820px; margin:0 auto 20px; background:#fff; border-radius:18px; box-shadow:0 3px 18px rgba(107,66,38,.08); border:1px solid #f0e4cf; overflow:hidden; }
        .card-hdr { display:flex; align-items:center; gap:12px; padding:16px 28px; background:#fdf6ed; border-bottom:1px solid #f5ede0; }
        .csh-icon { width:36px; height:36px; border-radius:10px; background:linear-gradient(135deg,#6B4226,#C05C2E); color:#fff; display:flex; align-items:center; justify-content:center; font-size:.9rem; }
        .csh-title { font-family:'Playfair Display',serif; font-size:1rem; font-weight:700; color:#2C2416; }
        .info-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); }
        .info-cell { padding:18px 28px; border-right:1px solid #f5ede0; border-bottom:1px solid #f5ede0; transition:background .15s; }
        .info-cell:hover { background:#fdf9f5; }
        .info-cell:nth-child(even) { border-right:none; }
        .info-cell.full { grid-column:1/-1; border-right:none; }
        .i-label { font-size:.72rem; font-weight:800; text-transform:uppercase; letter-spacing:.5px; color:#C05C2E; margin-bottom:6px; }
        .i-value { font-size:.93rem; color:#2C2416; font-weight:600; }
        .pill { display:inline-flex; padding:3px 12px; border-radius:20px; font-size:.75rem; font-weight:700; }
        .pill-green { background:#dcfce7; color:#15803d; }
        .pill-blue  { background:#dbeafe; color:#1d4ed8; }
        .order-row { display:flex; align-items:center; justify-content:space-between; padding:12px 28px; border-bottom:1px solid #f5ede0; transition:background .15s; }
        .order-row:last-child { border-bottom:none; }
        .order-row:hover { background:#fdf9f5; }
        .or-dot { width:34px; height:34px; border-radius:10px; background:#f5ede0; display:flex; align-items:center; justify-content:center; color:#C05C2E; flex-shrink:0; }
        .back-link { display:inline-flex; align-items:center; gap:8px; color:#6B4226; font-size:.88rem; font-weight:700; text-decoration:none; margin-bottom:20px; }
        .back-link:hover { color:#C05C2E; }
    </style>
</head>
<body>
<div layout:fragment="content" class="ai-page">
    <div style="max-width:820px;margin:0 auto;">

        <!-- Back -->
        <a th:href="@{/user/settings}" class="back-link">
            <i class="fas fa-arrow-left"></i> Back to Settings
        </a>

        <!-- Hero -->
        <div class="ai-hero">
            <div class="avatar-wrap">
                <img th:if="${user.profileImageUrl != null and !#strings.isEmpty(user.profileImageUrl)}"
                     th:src="${user.profileImageUrl}" alt="Profile"/>
                <i th:unless="${user.profileImageUrl != null and !#strings.isEmpty(user.profileImageUrl)}"
                   class="fas fa-user" style="font-size:2rem;color:rgba(255,255,255,.8);"></i>
            </div>
            <div style="flex:1;">
                <h1 th:text="${user.name}">Customer Name</h1>
                <p th:text="${user.email}">user@email.com</p>
                <div class="hero-badges">
                    <span class="hero-badge blue">🛍️ Buyer</span>
                    <span class="hero-badge" style="background:#dcfce7;color:#15803d;">✓ Active</span>
                </div>
            </div>
            <a th:href="@{/user/profile/updateInfo(email=${user.email})}" class="edit-btn">
                <i class="fas fa-pen"></i> Edit Profile
            </a>
        </div>

        <!-- Personal Info -->
        <div class="info-card">
            <div class="card-hdr">
                <div class="csh-icon"><i class="fas fa-user"></i></div>
                <span class="csh-title">Personal Information</span>
            </div>
            <div class="info-grid">
                <div class="info-cell">
                    <div class="i-label">Full Name</div>
                    <div class="i-value" th:text="${user.name}">Name</div>
                </div>
                <div class="info-cell">
                    <div class="i-label">Email Address</div>
                    <div class="i-value" style="color:#C05C2E;" th:text="${user.email}">email</div>
                </div>
                <div class="info-cell">
                    <div class="i-label">Phone Number</div>
                    <div class="i-value" th:text="${user.phoneNumber ?: '—'}">—</div>
                </div>
                <div class="info-cell">
                    <div class="i-label">Member Since</div>
                    <div class="i-value" th:text="${#temporals.format(user.createdAt, 'dd MMM yyyy')}">—</div>
                </div>
                <div class="info-cell">
                    <div class="i-label">Role</div>
                    <span class="pill pill-blue">🛍️ Buyer</span>
                </div>
                <div class="info-cell">
                    <div class="i-label">Account Status</div>
                    <span class="pill pill-green">✓ Active</span>
                </div>
            </div>
        </div>

        <!-- Recent Activity -->
        <div class="info-card">
            <div class="card-hdr">
                <div class="csh-icon"><i class="fas fa-history"></i></div>
                <span class="csh-title">Recent Activity</span>
            </div>

            <div th:if="${#lists.isEmpty(recentOrders)}"
                 style="text-align:center;padding:30px 24px;color:#8B7355;">
                <i class="fas fa-box-open" style="font-size:2rem;color:#d4c4a0;display:block;margin-bottom:10px;"></i>
                No recent activity yet
            </div>

            <div th:each="order : ${recentOrders}" class="order-row">
                <div style="display:flex;align-items:center;gap:14px;">
                    <div class="or-dot"><i class="fas fa-shopping-bag"></i></div>
                    <div>
                        <div style="font-weight:700;color:#2C2416;font-size:.88rem;" th:text="'Order #' + ${order.orderNumber}">Order</div>
                        <div style="font-size:.74rem;color:#8B7355;" th:text="${#temporals.format(order.createdAt, 'dd MMM yyyy')}">Date</div>
                    </div>
                </div>
                <div style="text-align:right;">
                    <div style="font-weight:800;color:#2C2416;" th:text="'₹' + ${order.totalAmount}">₹0</div>
                    <span th:class="${order.status == 'DELIVERED' ? 'pill pill-green' : 'pill pill-blue'}"
                          th:text="${order.status}" style="font-size:.7rem;">Status</span>
                </div>
            </div>
        </div>

    </div>
</div>
</body>
</html>
