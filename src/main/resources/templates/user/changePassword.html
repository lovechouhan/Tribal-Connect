<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
 xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
 layout:decorate="~{base}">
<head>
    <title>Change Password - TribalConnect</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .cp-page {
            background: linear-gradient(160deg, #fdf6ed 0%, #f5e8d3 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 36px 16px 72px;
        }
        .cp-back {
            width: 100%; max-width: 480px; margin-bottom: 16px;
        }
        .back-link {
            display: inline-flex; align-items: center; gap: 8px;
            color: #6B4226; font-size: .88rem; font-weight: 700;
            text-decoration: none;
        }
        .back-link:hover { color: #C05C2E; }

        /* ── Card ── */
        .cp-card {
            width: 100%;
            max-width: 480px;
            background: #fff;
            border-radius: 24px;
            box-shadow: 0 8px 48px rgba(107, 66, 38, .15), 0 2px 8px rgba(0,0,0,.04);
            overflow: hidden;
        }

        /* Header */
        .cp-header {
            background: linear-gradient(135deg, #2C1810 0%, #6B4226 55%, #C05C2E 100%);
            padding: 36px 36px 28px;
            text-align: center;
            position: relative;
            overflow: hidden;
        }
        .cp-header::before {
            content: '';
            position: absolute;
            right: -60px; top: -60px;
            width: 200px; height: 200px;
            border-radius: 50%;
            background: rgba(255,255,255,.07);
        }
        .cp-header::after {
            content: '';
            position: absolute;
            left: -40px; bottom: -40px;
            width: 130px; height: 130px;
            border-radius: 50%;
            background: rgba(255,255,255,.05);
        }
        .cp-lock-icon {
            width: 64px; height: 64px;
            border-radius: 18px;
            background: rgba(255,255,255,.18);
            display: flex; align-items: center; justify-content: center;
            font-size: 1.7rem;
            margin: 0 auto 16px;
            backdrop-filter: blur(8px);
            position: relative; z-index: 1;
        }
        .cp-header h1 {
            font-family: 'Playfair Display', serif;
            font-size: 1.6rem; font-weight: 800;
            color: #fff; margin: 0 0 6px;
            position: relative; z-index: 1;
        }
        .cp-header p {
            color: rgba(255,255,255,.72);
            font-size: .86rem; margin: 0;
            position: relative; z-index: 1;
        }

        /* Body */
        .cp-body { padding: 32px 36px 28px; }

        /* Alert messages */
        .alert-error {
            background: #fee2e2; border: 1px solid #fca5a5; color: #dc2626;
            border-radius: 12px; padding: 12px 16px; margin-bottom: 20px;
            display: flex; align-items: center; gap: 10px; font-size: .88rem; font-weight: 600;
        }
        .alert-success {
            background: #dcfce7; border: 1px solid #86efac; color: #15803d;
            border-radius: 12px; padding: 12px 16px; margin-bottom: 20px;
            display: flex; align-items: center; gap: 10px; font-size: .88rem; font-weight: 600;
        }

        /* Form fields */
        .field-group { margin-bottom: 20px; }
        .field-label {
            display: block;
            font-size: .76rem; font-weight: 800;
            text-transform: uppercase; letter-spacing: .5px;
            color: #6B4226; margin-bottom: 8px;
        }
        .field-wrap {
            position: relative;
        }
        .field-input {
            width: 100%; box-sizing: border-box;
            padding: 12px 44px 12px 14px;
            border: 1.5px solid #e2d5c3;
            border-radius: 12px;
            background: #fff;
            font-size: .94rem; color: #2C2416;
            outline: none;
            transition: border-color .2s, box-shadow .2s;
            font-family: inherit;
        }
        .field-input:focus {
            border-color: #C05C2E;
            box-shadow: 0 0 0 4px rgba(192, 92, 46, .12);
        }
        .field-input.error {
            border-color: #dc2626;
            box-shadow: 0 0 0 4px rgba(220, 38, 38, .1);
        }
        .field-input.valid {
            border-color: #16a34a;
            box-shadow: 0 0 0 4px rgba(22, 163, 74, .1);
        }
        .toggle-eye {
            position: absolute; right: 14px; top: 50%; transform: translateY(-50%);
            background: none; border: none; cursor: pointer;
            color: #8B7355; font-size: .9rem;
            transition: color .18s;
        }
        .toggle-eye:hover { color: #C05C2E; }

        /* Password strength */
        .strength-bar {
            height: 4px; border-radius: 4px;
            background: #f0e4cf; margin-top: 8px; overflow: hidden;
        }
        .strength-fill {
            height: 100%; border-radius: 4px;
            width: 0%; transition: width .3s, background .3s;
        }
        .strength-label { font-size: .74rem; color: #8B7355; margin-top: 5px; }
        .field-hint { font-size: .76rem; color: #8B7355; margin-top: 6px; }
        .match-error { font-size: .76rem; color: #dc2626; margin-top: 5px; display: none; }
        .match-ok    { font-size: .76rem; color: #16a34a; margin-top: 5px; display: none; }

        /* Security tips */
        .security-tips {
            background: #fdf6ed;
            border: 1px solid #f0e4cf;
            border-radius: 12px;
            padding: 14px 16px;
            margin-bottom: 22px;
        }
        .tips-title { font-size: .76rem; font-weight: 800; color: #6B4226; margin-bottom: 8px; text-transform: uppercase; letter-spacing: .4px; }
        .tip-item { font-size: .78rem; color: #8B7355; margin: 4px 0; display: flex; align-items: center; gap: 8px; }
        .tip-item i { color: #C05C2E; width: 14px; }

        /* Buttons */
        .cp-actions { display: flex; align-items: center; gap: 12px; }
        .btn-submit {
            flex: 1;
            padding: 13px;
            background: linear-gradient(135deg, #6B4226, #C05C2E);
            color: #fff; border: none; border-radius: 12px;
            font-size: .94rem; font-weight: 800;
            cursor: pointer;
            display: flex; align-items: center; justify-content: center; gap: 8px;
            box-shadow: 0 4px 16px rgba(192, 92, 46, .26);
            transition: opacity .2s, transform .18s;
        }
        .btn-submit:hover { opacity: .9; transform: translateY(-1px); }
        .btn-submit:disabled { opacity: .5; cursor: not-allowed; transform: none; }
        .btn-cancel {
            padding: 13px 20px;
            background: #fff; color: #6B4226;
            border: 1.5px solid #d4c4a0; border-radius: 12px;
            font-size: .88rem; font-weight: 700;
            cursor: pointer; text-decoration: none;
            transition: background .2s;
        }
        .btn-cancel:hover { background: #f5ede0; }

        /* Divider stripe */
        .cp-stripe {
            height: 4px;
            background: linear-gradient(90deg, #2C1810, #6B4226, #C05C2E, #f5a623, #C05C2E, #6B4226, #2C1810);
        }
    </style>
</head>
<body>
<div layout:fragment="content" class="cp-page">

    <!-- Back link -->
    <div class="cp-back">
        <a th:href="@{/user/settings}" class="back-link">
            <i class="fas fa-arrow-left"></i> Back to Settings
        </a>
    </div>

    <div class="cp-card">

        <!-- Accent stripe -->
        <div class="cp-stripe"></div>

        <!-- Header -->
        <div class="cp-header">
            <div class="cp-lock-icon">🔐</div>
            <h1>Change Password</h1>
            <p>Keep your account safe with a strong password</p>
        </div>

        <!-- Body -->
        <div class="cp-body">

            <!-- Server alerts -->
            <div th:if="${error}" class="alert-error">
                <i class="fas fa-exclamation-circle"></i>
                <span th:text="${error}">Error message</span>
            </div>
            <div th:if="${success}" class="alert-success">
                <i class="fas fa-check-circle"></i>
                <span th:text="${success}">Success message</span>
            </div>

            <!-- Security tips -->
            <div class="security-tips">
                <div class="tips-title">💡 Password Tips</div>
                <div class="tip-item"><i class="fas fa-check"></i> At least 8 characters long</div>
                <div class="tip-item"><i class="fas fa-check"></i> Mix uppercase, lowercase &amp; numbers</div>
                <div class="tip-item"><i class="fas fa-check"></i> Use a special character (e.g. @, #, !)</div>
            </div>

            <form th:action="@{/user/settings/change-password}" method="post" novalidate id="changePasswordForm">

                <!-- Current Password -->
                <div class="field-group">
                    <label class="field-label" for="currentPassword">Current Password</label>
                    <div class="field-wrap">
                        <input id="currentPassword" name="currentPassword" type="password"
                               required class="field-input" placeholder="Enter your current password"/>
                        <button type="button" class="toggle-eye" onclick="togglePwd('currentPassword', this)">
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>
                </div>

                <!-- New Password -->
                <div class="field-group">
                    <label class="field-label" for="newPassword">New Password</label>
                    <div class="field-wrap">
                        <input id="newPassword" name="newPassword" type="password"
                               required class="field-input" placeholder="Create a strong new password"
                               oninput="checkStrength(this.value)"/>
                        <button type="button" class="toggle-eye" onclick="togglePwd('newPassword', this)">
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>
                    <div class="strength-bar"><div class="strength-fill" id="strengthFill"></div></div>
                    <div class="strength-label" id="strengthLabel">Enter a password</div>
                </div>

                <!-- Confirm Password -->
                <div class="field-group">
                    <label class="field-label" for="confirmPassword">Confirm New Password</label>
                    <div class="field-wrap">
                        <input id="confirmPassword" name="confirmPassword" type="password"
                               required class="field-input" placeholder="Re-enter your new password"
                               oninput="checkMatch()"/>
                        <button type="button" class="toggle-eye" onclick="togglePwd('confirmPassword', this)">
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>
                    <div class="match-error" id="matchError"><i class="fas fa-times"></i> Passwords do not match</div>
                    <div class="match-ok"    id="matchOk"><i class="fas fa-check"></i> Passwords match</div>
                </div>

                <!-- Actions -->
                <div class="cp-actions">
                    <a th:href="@{/user/settings}" class="btn-cancel">Cancel</a>
                    <button type="submit" id="submitBtn" class="btn-submit">
                        <i class="fas fa-save"></i> Update Password
                    </button>
                </div>

            </form>
        </div>

        <!-- Bottom stripe -->
        <div class="cp-stripe"></div>
    </div>
</div>

<script>
    /* Toggle password visibility */
    function togglePwd(id, btn) {
        const inp = document.getElementById(id);
        const ico = btn.querySelector('i');
        if (inp.type === 'password') {
            inp.type = 'text';
            ico.className = 'fas fa-eye-slash';
        } else {
            inp.type = 'password';
            ico.className = 'fas fa-eye';
        }
    }

    /* Strength meter */
    function checkStrength(val) {
        const fill  = document.getElementById('strengthFill');
        const label = document.getElementById('strengthLabel');
        let score = 0;
        if (val.length >= 8)  score++;
        if (/[A-Z]/.test(val)) score++;
        if (/[0-9]/.test(val)) score++;
        if (/[^A-Za-z0-9]/.test(val)) score++;

        const levels = [
            { w:'0%',   bg:'transparent', txt:'' },
            { w:'25%',  bg:'#dc2626',     txt:'Weak' },
            { w:'50%',  bg:'#f59e0b',     txt:'Fair' },
            { w:'75%',  bg:'#3b82f6',     txt:'Good' },
            { w:'100%', bg:'#16a34a',     txt:'Strong ✓' },
        ];
        const lv = val.length === 0 ? levels[0] : levels[score] || levels[1];
        fill.style.width      = lv.w;
        fill.style.background = lv.bg;
        label.textContent     = lv.txt;
        checkMatch();
    }

    /* Match check */
    function checkMatch() {
        const np  = document.getElementById('newPassword').value;
        const cp  = document.getElementById('confirmPassword').value;
        const err = document.getElementById('matchError');
        const ok  = document.getElementById('matchOk');
        const btn = document.getElementById('submitBtn');
        const ci  = document.getElementById('confirmPassword');
        if (!cp) { err.style.display='none'; ok.style.display='none'; ci.className='field-input'; btn.disabled=false; return; }
        if (np === cp) {
            err.style.display='none'; ok.style.display='block';
            ci.className='field-input valid'; btn.disabled=false;
        } else {
            ok.style.display='none'; err.style.display='block';
            ci.className='field-input error'; btn.disabled=true;
        }
    }

    /* Final form submit guard */
    document.getElementById('changePasswordForm').addEventListener('submit', function(e) {
        const np = document.getElementById('newPassword').value;
        const cp = document.getElementById('confirmPassword').value;
        if (np !== cp) { e.preventDefault(); document.getElementById('matchError').style.display='block'; }
    });
</script>
</body>
</html>
