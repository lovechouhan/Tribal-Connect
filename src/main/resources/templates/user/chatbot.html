<div th:fragment="chatbot">
    <!-- Chatbot Toggle Button with Pulse Glow & Floating Badge -->
    <div class="fixed bottom-5 right-5 z-50 flex items-center gap-3">
        <!-- Optional Floating Welcome Badge -->
        <div class="hidden sm:flex items-center gap-2 px-4 py-2 rounded-full shadow-lg bg-white border border-orange-100 text-xs font-semibold text-gray-700 animate-pulse cursor-pointer" onclick="document.getElementById('chatbot-toggle-btn').click()">
            <span class="flex h-2 w-2 rounded-full bg-emerald-500"></span>
            <span>Sarathi AI</span>
        </div>

        <!-- Main Toggle Button -->
        <div id="chatbot-toggle-btn" class="w-16 h-16 rounded-full shadow-2xl z-50 cursor-pointer flex items-center justify-center transition-all duration-300 hover:scale-110 active:scale-95" style="background: linear-gradient(135deg, #6B4226 0%, #C05C2E 100%); box-shadow: 0 8px 25px rgba(192, 92, 46, 0.4);">
            <h1 class="sr-only">Chatbot Toggle</h1>
            <div class="relative">
                <i class="fa-solid fa-robot text-white text-2xl"></i>
                <div class="absolute -top-1 -right-1 w-3 h-3 bg-yellow-400 rounded-full border-2 border-white animate-ping"></div>
                <div class="absolute -top-1 -right-1 w-3 h-3 bg-yellow-400 rounded-full border-2 border-white"></div>
            </div>
        </div>
    </div>

    <!-- Chatbot Window -->
    <div id="chatbot-window" class="fixed bottom-24 right-5 z-50 w-[380px] hidden transition-all duration-300 ai-window-anim">
        <div class="rounded-2xl shadow-2xl overflow-hidden border flex flex-col" style="background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(16px); border-color: rgba(192, 92, 46, 0.2); box-shadow: 0 25px 50px -12px rgba(107, 66, 38, 0.35);">
            
            <!-- Premium Header -->
            <div style="background: linear-gradient(135deg, #6B4226 0%, #C05C2E 100%); padding: 20px 24px; color: #fff; position: relative;">
                <div class="flex items-center justify-between">
                    <div class="flex items-center gap-3">
                        <div class="w-10 h-10 rounded-full flex items-center justify-center border border-white/20 shadow-inner" style="background: rgba(255, 255, 255, 0.15); backdrop-filter: blur(8px);">
                            <i class="fa-solid fa-wand-magic-sparkles text-yellow-300 text-lg"></i>
                        </div>
                        <div>
                            <h3 style="font-family: 'Playfair Display', serif; font-size: 1.25rem; font-weight: 700; margin: 0; text-shadow: 0 2px 4px rgba(0,0,0,0.2);">Sarathi AI</h3>
                            <p style="font-size: 0.75rem; color: #E8D5B0; margin: 0; font-family: 'Poppins', sans-serif; display: flex; align-items: center; gap: 4px;">
                                <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse"></span> TribalConnect AI Assistant
                            </p>
                        </div>
                    </div>
                    <button id="close-chatbot-btn" class="text-white/80 hover:text-white text-2xl focus:outline-none transition-colors cursor-pointer">&times;</button>
                </div>
                <!-- Decorative Gold Bar -->
                <div class="absolute bottom-0 left-0 right-0 h-1" style="background: linear-gradient(90deg, #D4960A, #F0B830, #D4960A);"></div>
            </div>
            
            <!-- Messages Container -->
            <div id="chat-messages" class="h-[420px] overflow-y-auto p-5 space-y-4" style="background: #FDFBF7;">
                <!-- Initial Bot Message -->
                <div class="bot-message">
                    <div class="flex items-center gap-2 mb-1 text-[0.7rem] font-bold uppercase tracking-wider" style="color: #C05C2E;">
                        <i class="fa-solid fa-robot"></i> Sarathi AI
                    </div>
                    Hello! I'm Sarathi, your TribalConnect shopping assistant. How can I help you explore our authentic handmade crafts today?
                </div>

                <!-- Server Rendered Messages (if any) -->
                <div th:if="${responseTEXT}" class="space-y-4">
                    <div th:each="resp : ${responseTEXT}" class="bot-message">
                        <div class="flex items-center gap-2 mb-1 text-[0.7rem] font-bold uppercase tracking-wider" style="color: #C05C2E;">
                            <i class="fa-solid fa-robot"></i> Sarathi AI
                        </div>
                        <span th:text="${resp}"></span>
                    </div>
                </div>
            </div>

            <!-- Input Area -->
           <form th:action="@{/stream}" method="post" id="chatForm" class="p-4 bg-white border-t border-orange-100">
               <div class="flex items-center gap-2 bg-gray-50 border border-gray-200 rounded-full p-1.5 focus-within:border-terracotta focus-within:ring-2 focus-within:ring-orange-100 transition-all">
                   <input type="text" 
                       id="userInput" 
                       name="inputText"
                       class="flex-1 bg-transparent px-4 py-2 text-sm text-gray-800 focus:outline-none placeholder-gray-400" 
                       placeholder="Ask about tribal crafts, orders, advice..."
                       required
                   >
                   <button type="submit" 
                       id="sendButton"
                       class="text-white px-5 py-2 rounded-full text-sm font-semibold transition-all duration-200 flex items-center gap-2 shadow-md hover:shadow-lg active:scale-95 cursor-pointer"
                       style="background: linear-gradient(135deg, #C05C2E 0%, #6B4226 100%);"
                   >
                       <span>Send</span>
                       <i class="fa-solid fa-paper-plane text-xs"></i>
                   </button>
               </div>
           </form>
        </div>
    </div>

    <style>
        .ai-window-anim {
            animation: chatWindowAppear 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        @keyframes chatWindowAppear {
            from { opacity: 0; transform: scale(0.9) translateY(20px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }

        /* Premium Message Bubbles */
        .bot-message {
            background: #FFFFFF;
            border-left: 4px solid #C05C2E;
            box-shadow: 0 4px 15px rgba(107, 66, 38, 0.08);
            color: #2C2416;
            border-radius: 16px 16px 16px 4px;
            padding: 14px 18px;
            font-size: 0.92rem;
            line-height: 1.5;
            margin-bottom: 1rem;
            max-width: 85%;
            width: fit-content;
            font-family: 'Poppins', sans-serif;
            border-top: 1px solid rgba(192, 92, 46, 0.1);
            border-right: 1px solid rgba(192, 92, 46, 0.1);
            border-bottom: 1px solid rgba(192, 92, 46, 0.1);
        }

        .user-message {
            background: linear-gradient(135deg, #C05C2E 0%, #6B4226 100%);
            color: #FFFFFF;
            box-shadow: 0 4px 15px rgba(192, 92, 46, 0.25);
            border-radius: 16px 16px 4px 16px;
            padding: 14px 18px;
            font-size: 0.92rem;
            line-height: 1.5;
            margin-left: auto;
            margin-bottom: 1rem;
            max-width: 85%;
            width: fit-content;
            text-align: right;
            font-family: 'Poppins', sans-serif;
        }

        /* Typing Indicator Styling */
        .typing-indicator {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 4px 8px;
        }
        .typing-dot {
            width: 6px;
            height: 6px;
            background: #C05C2E;
            border-radius: 50%;
            animation: typing-bounce 1.4s infinite ease-in-out;
        }
        .typing-dot:nth-child(2) { animation-delay: 0.2s; }
        .typing-dot:nth-child(3) { animation-delay: 0.4s; }
        @keyframes typing-bounce {
            0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
            30% { transform: translateY(-6px); opacity: 1; }
        }

        /* Custom Scrollbar for Chat Messages */
        #chat-messages::-webkit-scrollbar {
            width: 6px;
        }
        #chat-messages::-webkit-scrollbar-track {
            background: #F5EAD2;
            border-radius: 8px;
        }
        #chat-messages::-webkit-scrollbar-thumb {
            background: #C05C2E;
            border-radius: 8px;
        }
    </style>

    <script th:inline="javascript">
        document.addEventListener('DOMContentLoaded', function() {
            const chatToggleBtn = document.getElementById('chatbot-toggle-btn');
            const chatWindow = document.getElementById('chatbot-window');
            const closeChatBtn = document.getElementById('close-chatbot-btn');
            const userInput = document.getElementById('userInput');
            const chatForm = document.getElementById('chatForm');
            const messagesContainer = document.getElementById('chat-messages');

            // Toggle chat window
            chatToggleBtn.addEventListener('click', () => {
                chatWindow.classList.toggle('hidden');
                if (!chatWindow.classList.contains('hidden')) {
                    userInput.focus();
                }
            });

            // Close chat window
            closeChatBtn.addEventListener('click', () => {
                chatWindow.classList.add('hidden');
            });

            // 🧠 Handle message sending (Streaming)
            chatForm.addEventListener('submit', async (e) => {
                e.preventDefault();
                const message = userInput.value.trim();
                if (!message) return;

                // 1️⃣ Add user message to UI
                const userMsg = document.createElement('div');
                userMsg.className = 'user-message';
                userMsg.innerHTML = `
                    <div class="mb-1 text-[0.7rem] font-bold uppercase tracking-wider" style="color: #E8D5B0;">You</div>
                    <div>${message}</div>
                `;
                messagesContainer.appendChild(userMsg);
                messagesContainer.scrollTop = messagesContainer.scrollHeight;

                // 2️⃣ Create bot message placeholder
                const botMsg = document.createElement('div');
                botMsg.className = 'bot-message';
                botMsg.innerHTML = `
                  <div class="flex items-center gap-2 mb-1 text-[0.7rem] font-bold uppercase tracking-wider" style="color: #C05C2E;">
                      <i class="fa-solid fa-robot"></i> Sarathi AI
                  </div>
                  <div class="typing-indicator my-2">
                    <span class="typing-dot"></span>
                    <span class="typing-dot"></span>
                    <span class="typing-dot"></span>
                  </div>
                `;
                messagesContainer.appendChild(botMsg);
                messagesContainer.scrollTop = messagesContainer.scrollHeight;

                // 3️⃣ Clear input
                userInput.value = '';

                // 4️⃣ Send to backend WITH current page context
                try {
                    const currentPage = window.location.href;
                    const response = await fetch(`/stream?inputText=${encodeURIComponent(message)}&page=${encodeURIComponent(currentPage)}`, {
                        method: 'POST'
                    });

                    if (!response.ok) throw new Error('Network response was not ok');

                    // 5️⃣ Read streaming response
                    const reader = response.body.getReader();
                    const decoder = new TextDecoder();
                    let fullText = "";

                    while (true) {
                        const { done, value } = await reader.read();
                        if (done) break;
                        const chunk = decoder.decode(value, { stream: true });
                        fullText += chunk;
                        // Clean up SSE formatting if present
                        const cleanedText = fullText.replace(/^data:\s*/gm, '').replace(/\n\n/g, '\n');
                        botMsg.innerHTML = `
                          <div class="flex items-center gap-2 mb-1 text-[0.7rem] font-bold uppercase tracking-wider" style="color: #C05C2E;">
                              <i class="fa-solid fa-robot"></i> Sarathi AI
                          </div>
                          <div class="text-sm text-gray-800 leading-relaxed whitespace-pre-wrap">${cleanedText}</div>
                        `;
                        messagesContainer.scrollTop = messagesContainer.scrollHeight;
                    }
                } catch (error) {
                    console.error('Error during streaming:', error);
                    botMsg.innerHTML = `
                      <div class="flex items-center gap-2 mb-1 text-[0.7rem] font-bold text-red-600 uppercase tracking-wider">
                          <i class="fa-solid fa-triangle-exclamation"></i> Error
                      </div>
                      <div class="text-red-500 text-sm">Sorry, I encountered an error connecting to the AI service. Please try again.</div>
                    `;
                    messagesContainer.scrollTop = messagesContainer.scrollHeight;
                }
            });
        });
    </script>
</div>
