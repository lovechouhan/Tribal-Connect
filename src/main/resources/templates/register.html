<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{base}">
<head>
  <title>Join TribalConnect — Register as Buyer</title>
</head>
<body>
<div layout:fragment="content" style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:32px 16px;background:linear-gradient(135deg,rgba(192,92,46,0.06),rgba(61,107,69,0.06));">
  <div style="width:100%;max-width:680px;">

    <div style="text-align:center;margin-bottom:28px;">
      <div style="font-size:3rem;margin-bottom:8px;">🛒</div>
      <h1 style="font-family:'Playfair Display',serif;font-size:1.9rem;font-weight:900;color:#2C2416;margin:0 0 6px;">Join TribalConnect</h1>
      <p style="color:#8B7355;font-size:0.9rem;">Shop authentic tribal handcrafts &amp; support indigenous artisans across India.</p>
    </div>

    <div class="auth-card" style="padding:36px 32px;">
      <h2 style="font-family:'Playfair Display',serif;font-size:1.2rem;color:#6B4226;margin:0 0 22px;font-weight:800;">Create Buyer Account</h2>
      <form th:object="${userForm}" th:action="@{/register}" method="post" enctype="multipart/form-data"
            style="display:grid;grid-template-columns:1fr 1fr;gap:14px;">

        <div>
          <label style="font-size:0.82rem;font-weight:600;color:#6B4226;display:block;margin-bottom:6px;">Full Name *</label>
          <input type="text" name="name" required placeholder="Your full name" class="tribal-input">
        </div>
        <div>
          <label style="font-size:0.82rem;font-weight:600;color:#6B4226;display:block;margin-bottom:6px;">Mobile Number *</label>
          <input type="text" name="phoneNumber" required placeholder="+91 XXXXXXXXXX" class="tribal-input">
        </div>
        <div style="grid-column:1/-1;">
          <label style="font-size:0.82rem;font-weight:600;color:#6B4226;display:block;margin-bottom:6px;">Email Address *</label>
          <input type="email" name="email" required placeholder="your@email.com" class="tribal-input">
        </div>
        <div>
          <label style="font-size:0.82rem;font-weight:600;color:#6B4226;display:block;margin-bottom:6px;">City *</label>
          <input type="text" name="city" required class="tribal-input">
        </div>
        <div>
          <label style="font-size:0.82rem;font-weight:600;color:#6B4226;display:block;margin-bottom:6px;">State *</label>
          <input type="text" name="state" required class="tribal-input">
        </div>
        <div>
          <label style="font-size:0.82rem;font-weight:600;color:#6B4226;display:block;margin-bottom:6px;">PIN Code *</label>
          <input type="text" name="pincode" required class="tribal-input">
        </div>
        <div>
          <label style="font-size:0.82rem;font-weight:600;color:#6B4226;display:block;margin-bottom:6px;">Password *</label>
          <input type="password" name="password" required placeholder="Strong password" class="tribal-input">
        </div>
        <div style="grid-column:1/-1;">
          <label style="font-size:0.82rem;font-weight:600;color:#6B4226;display:block;margin-bottom:6px;">Profile Photo (optional)</label>
          <input type="file" id="profilePic" name="profilePic" accept="image/*" style="font-size:0.84rem;color:#6B4226;">
        </div>

        <div style="grid-column:1/-1;margin-top:8px;">
          <button type="submit" class="btn-tribal" style="width:100%;padding:13px;font-size:0.95rem;">
            🎉 Join TribalConnect
          </button>
          <div style="margin-top:14px;text-align:center;display:flex;flex-direction:column;gap:6px;">
            <p style="font-size:0.84rem;color:#8B7355;margin:0;">Already a member? <a th:href="@{'/login'}" style="color:#C05C2E;font-weight:700;text-decoration:none;">Login here</a></p>
            <p style="font-size:0.84rem;color:#8B7355;margin:0;">Are you a tribal artisan? <a th:href="@{'/sellers/register'}" style="color:#3D6B45;font-weight:700;text-decoration:none;">Register as Artisan →</a></p>
          </div>
        </div>
      </form>
    </div>
  </div>
</div>
</body>
</html>
