<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
  layout:decorate="~{base}">

<head>
  <title>Sign In — TribalConnect</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
</head>

<body>
  <div layout:fragment="content"
    style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:32px 16px;background:linear-gradient(135deg,rgba(192,92,46,0.08),rgba(212,150,10,0.05),rgba(61,107,69,0.08));">
    <div style="width:100%;max-width:420px;">

      <!-- Brand Header -->
      <div style="text-align:center;margin-bottom:28px;">
        <div style="font-size:3.5rem;margin-bottom:8px;">🌿</div>
        <h1 style="font-family:'Playfair Display',serif;font-size:1.8rem;font-weight:900;color:#6B4226;margin:0 0 4px;">
          TribalConnect</h1>
        <p style="font-family:'Kalam',cursive;color:#C05C2E;font-size:0.9rem;margin:0;">Tribal Artisan Marketplace</p>
      </div>

      <div class="auth-card" style="padding:32px 28px;">
        <h2
          style="font-family:'Playfair Display',serif;font-size:1.4rem;font-weight:800;color:#2C2416;margin:0 0 24px;text-align:center;">
          Welcome Back 👋</h2>

        <!-- Alerts -->
        <div th:if="${param.verified}" class="tribal-alert-success" style="margin-bottom:16px;">
          Account verified! Please sign in.
        </div>
        <div th:if="${param.error}" class="tribal-alert-error" style="margin-bottom:16px;">
          Invalid credentials. Please check and try again.
        </div>

        <!-- Login Form -->
        <form th:action="@{/authenticate}" method="post" style="display:flex;flex-direction:column;gap:16px;">
          <div>
            <label for="email"
              style="font-size:0.82rem;font-weight:600;color:#6B4226;display:block;margin-bottom:6px;"><i
                class="fas fa-envelope mr-1" style="color:#C05C2E;"></i>Email Address</label>
            <input id="email" type="email" name="email" required placeholder="Enter your email" class="tribal-input">
          </div>
          <div>
            <label for="password"
              style="font-size:0.82rem;font-weight:600;color:#6B4226;display:block;margin-bottom:6px;"><i
                class="fas fa-lock mr-1" style="color:#C05C2E;"></i>Password</label>
            <input id="password" type="password" name="password" required placeholder="Enter your password"
              class="tribal-input">
          </div>
          <!-- <p
            style="font-size:0.76rem;color:#8B7355;text-align:center;background:#FDF6E9;padding:8px;border-radius:8px;">
            <i class="fas fa-info-circle mr-1" style="color:#D4960A;"></i>Google Sign-In is for buyers only, not for
            artisan/seller accounts.
          </p> -->
          <button type="submit" class="btn-tribal"
            style="padding:13px; font-size:0.95rem;text-align:center;width:100%;">
            <i class="fas fa-sign-in-alt mr-2 text-black-500"></i>Sign In to Marketplace
          </button>
        </form>

        <!-- Divider
      <div style="display:flex;align-items:center;gap:12px;margin:18px 0;">
        <hr style="flex:1;border:none;border-top:1px solid #E8D5B0;">
        <span style="font-size:0.78rem;color:#8B7355;font-weight:500;">OR</span>
        <hr style="flex:1;border:none;border-top:1px solid #E8D5B0;">
      </div> -->

        <!-- Google Sign-In -->
        <!-- <a th:href="@{'/oauth2/authorization/google'}"
         style="display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:11px;border:1.5px solid #E8D5B0;border-radius:8px;background:#fff;text-decoration:none;color:#4a3520;font-size:0.9rem;font-weight:500;transition:box-shadow 0.2s;"
         onmouseover="this.style.boxShadow='0 4px 12px rgba(107,66,38,0.12)'" onmouseout="this.style.boxShadow='none'">
        <img src="https://www.svgrepo.com/show/475656/google-color.svg" alt="Google" style="width:20px;height:20px;">
        Sign in with Google
      </a> -->

        <!-- Register Links -->
        <div style="margin-top:20px;text-align:center;display:flex;flex-direction:column;gap:8px;">
          <p style="font-size:0.84rem;color:#8B7355;margin:0;">
            New buyer? <a th:href="@{'/register'}" style="color:#C05C2E;font-weight:700;text-decoration:none;">Create
              Account</a>
          </p>
          <p style="font-size:0.84rem;color:#8B7355;margin:0;">
            Tribal artisan? <a th:href="@{'/sellers/register'}"
              style="color:#3D6B45;font-weight:700;text-decoration:none;">Register as Artisan</a>
          </p>
        </div>
      </div>

      <!-- Trust Badges -->
      <div style="display:flex;justify-content:center;gap:16px;margin-top:20px;flex-wrap:wrap;">
        <span style="font-size:0.74rem;color:#8B7355;display:flex;align-items:center;gap:4px;"><i
            class="fas fa-shield-alt" style="color:#3D6B45;"></i>Secure Login</span>
        <span style="font-size:0.74rem;color:#8B7355;display:flex;align-items:center;gap:4px;"><i class="fas fa-lock"
            style="color:#3D6B45;"></i>Encrypted</span>
        <span style="font-size:0.74rem;color:#8B7355;display:flex;align-items:center;gap:4px;"><i
            class="fas fa-check-circle" style="color:#3D6B45;"></i>TRIFED Verified</span>
      </div>
    </div>
  </div>
</body>

</html>
